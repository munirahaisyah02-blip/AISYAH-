<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #1a1a1a;
            text-align: center;
        }
        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .calculator-layout {
                grid-template-columns: 350px 1fr;
            }
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #4a5568;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
        }
        .bounds-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }
        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1e40af;
            font-weight: bold;
        }
        .result-value {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a8a;
            margin-top: 5px;
        }
        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .chart-container {
            position: relative;
            min-height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integration Calculator</h1>
    
    <div class="calculator-layout">
        <div class="controls">
            <div class="input-group">
                <label for="functionInput">Function f(x)</label>
                <input type="text" id="functionInput" value="x^2 - 2x" placeholder="e.g., x^2, sin(x)">
                <div id="errorMsg" class="error">Invalid expression</div>
            </div>
            
            <div class="bounds-group">
                <div class="input-group">
                    <label for="boundA">Lower Bound (a)</label>
                    <input type="number" id="boundA" value="0" step="any">
                </div>
                <div class="input-group">
                    <label for="boundB">Upper Bound (b)</label>
                    <input type="number" id="boundB" value="3" step="any">
                </div>
            </div>

            <div class="result-box">
                <div class="result-title">Definite Integral Result</div>
                <div class="result-value" id="integralResult">0.00</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // Initialize standard graph elements
    const ctx = document.getElementById('graphCanvas').getContext('2d');
    let chart;

    // Numerical integration using Simpson's 1/3 Rule
    function simpsonsRule(f, a, b, n = 1000) {
        if (n % 2 !== 0) n++; // Simpson's rule requires an even number of intervals
        const h = (b - a) / n;
        let sum = f(a) + f(b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += i % 2 === 0 ? 2 * f(x) : 4 * f(x);
        }
        return (h / 3) * sum;
    }

    function calculateAndPlot() {
        const exprString = document.getElementById('functionInput').value;
        const a = parseFloat(document.getElementById('boundA').value);
        const b = parseFloat(document.getElementById('boundB').value);
        const errorMsg = document.getElementById('errorMsg');
        const resultDisplay = document.getElementById('integralResult');

        errorMsg.style.display = 'none';

        try {
            // Compile user input using math.js
            const compiledExpr = math.compile(exprString);
            const f = (x) => compiledExpr.evaluate({ x: x });

            // 1. Calculate Integral
            if (isNaN(a) || isNaN(b)) {
                resultDisplay.textContent = "—";
                return;
            }
            const result = simpsonsRule(f, a, b);
            resultDisplay.textContent = Number(result.toFixed(5));

            // 2. Generate Data Points for Charting
            // We expand the view dynamic range slightly past [a, b] for better context
            const pad = Math.abs(b - a) * 0.5 || 2; 
            const minX = Math.min(a, b) - pad;
            const maxX = Math.max(a, b) + pad;
            
            const linePoints = [];
            const fillPoints = [];
            const steps = 200;
            const stepSize = (maxX - minX) / steps;

            for (let i = 0; i <= steps; i++) {
                const x = minX + i * stepSize;
                let y;
                try {
                    y = f(x);
                } catch(e) { y = null; }

                if (typeof y === 'number' && !isNaN(y) && isFinite(y)) {
                    linePoints.push({ x: x, y: y });
                    
                    // Populate shaded area datasets strictly inside [a, b] boundary
                    if (x >= Math.min(a, b) && x <= Math.max(a, b)) {
                        fillPoints.push({ x: x, y: y });
                    }
                }
            }

            updateChart(linePoints, fillPoints, a, b);

        } catch (error) {
            errorMsg.style.display = 'block';
            resultDisplay.textContent = "Error";
        }
    }

    function updateChart(linePoints, fillPoints, a, b) {
        if (chart) {
            chart.destroy(); // Wipe prior render instance
        }

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'f(x)',
                        data: linePoints,
                        borderColor: '#2563eb',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1
                    },
                    {
                        label: 'Area under curve',
                        data: fillPoints,
                        backgroundColor: 'rgba(59, 130, 246, 0.25)',
                        borderColor: 'transparent',
                        pointRadius: 0,
                        fill: 'origin' // Fills down to y=0 baseline axis
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'x'
                        }
                    },
                    y: {
                        type: 'linear',
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'y'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false // Keeps user interface clean
                    }
                }
            }
        });
    }

    // Attach real-time interactive input listeners
    document.getElementById('functionInput').addEventListener('input', calculateAndPlot);
    document.getElementById('boundA').addEventListener('input', calculateAndPlot);
    document.getElementById('boundB').addEventListener('input', calculateAndPlot);

    // Initial Trigger on page load
    calculateAndPlot();
</script>

</body>
</html>
